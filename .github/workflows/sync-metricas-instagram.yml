name: Sincronizar métricas do Instagram

# Roda toda segunda-feira, 1h da manhã em Brasília (04:00 UTC) — antes da
# Routine do calendário editorial (8h de Brasília), para que qualquer
# métrica nova já esteja no Notion quando a skill calendario-semanal
# checar, no passo 1, se há relatório pendente.
#
# Pré-requisitos e explicação completa: docs/metricas-automacao.md
on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sincronizar métricas (Meta Graph API → Notion)
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_IG_BUSINESS_ID: ${{ secrets.META_IG_BUSINESS_ID }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_POSTS_DATA_SOURCE_ID: ${{ secrets.NOTION_POSTS_DATA_SOURCE_ID }}
        run: python3 scripts/sync_metricas_instagram.py
