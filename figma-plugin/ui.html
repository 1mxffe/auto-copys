<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body {
    font-family: Inter, -apple-system, sans-serif;
    font-size: 12px;
    padding: 12px;
    margin: 0;
    color: #1a1a1a;
  }
  p {
    margin: 0 0 10px;
    color: #555;
    line-height: 1.4;
  }
  label {
    display: block;
    margin-bottom: 4px;
    font-weight: 600;
  }
  input {
    width: 100%;
    box-sizing: border-box;
    padding: 6px 8px;
    margin-bottom: 10px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 12px;
  }
  button {
    width: 100%;
    padding: 8px;
    background: #18a0fb;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
  }
  button:hover {
    background: #0d8ee0;
  }
  #log {
    margin-top: 12px;
    white-space: pre-wrap;
    font-family: "SF Mono", monospace;
    font-size: 11px;
    max-height: 110px;
    overflow-y: auto;
    background: #f5f5f5;
    border-radius: 4px;
    padding: 8px;
  }
  .erro {
    color: #d32f2f;
  }
</style>
</head>
<body>
  <p>
    Busca <code>calendarios/&lt;semana&gt;/posts.json</code> direto do
    GitHub e preenche os templates da página atual (ver
    <code>docs/templates-figma.md</code>).
  </p>
  <label for="semana">Semana</label>
  <input id="semana" placeholder="2026-S35" />
  <button id="rodar">Buscar e popular templates</button>
  <div id="log"></div>

  <script>
    const btn = document.getElementById("rodar");
    const log = document.getElementById("log");
    const input = document.getElementById("semana");

    btn.onclick = () => {
      const semana = input.value;
      log.textContent = "Buscando...";
      btn.disabled = true;
      parent.postMessage({ pluginMessage: { type: "popular", semana } }, "*");
    };

    onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;
      btn.disabled = false;
      if (msg.type === "erro") {
        log.innerHTML = `<span class="erro">${msg.texto}</span>`;
      } else if (msg.type === "resultado") {
        log.textContent = msg.log.join("\n");
      }
    };
  </script>
</body>
</html>
